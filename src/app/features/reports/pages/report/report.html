<div class="report-container">

    <div class="community-info">

        <h3>{{ reportService.report.nombreComunidad }}</h3>

        <p>{{ reportService.report.ubicacionComunidad }}</p>

    </div>


    <div class="form-group">

        <app-motivo-visita [(motivo)]="reportService.report.motivoVisita" (motivoChange)="guardarBorrador()">
        </app-motivo-visita>

    </div>


    <div class="form-group">

        <label>
            Concepto del trabajo
        </label>

        <textarea rows="4" class="form-control" placeholder="Describa el trabajo realizado..."
            [(ngModel)]="reportService.report.conceptoTrabajo" (ngModelChange)="guardarBorrador()">
        </textarea>

    </div>

    <div class="form-group">

        <label>
            Contacto
        </label>

        <input type="text" class="form-control" placeholder="Nombre o información de contacto"
            [(ngModel)]="reportService.report.contacto" (ngModelChange)="guardarBorrador()">

    </div>

    <!-- <div class="form-group">

        <label>
            Duración del trabajo
        </label>
    
        <input
            type="time"
            class="form-control"
            [(ngModel)]="reportService.report.duracion">
    
    </div> -->
    <div class="form-group">

        <label>
            Duración del trabajo
        </label>

        <select class="form-control" [(ngModel)]="reportService.report.duracion" (ngModelChange)="guardarBorrador()">

            <option value="">
                Seleccione la duración
            </option>

            <option value="30 minutos">
                30 minutos
            </option>

            <option value="1 hora">
                1 hora
            </option>

            <option value="1 hora 30 minutos">
                1 hora 30 minutos
            </option>

            <option value="2 horas">
                2 horas
            </option>

            <option value="2 horas 30 minutos">
                2 horas 30 minutos
            </option>

            <option value="3 horas">
                3 horas
            </option>

            <option value="3 horas 30 minutos">
                3 horas 30 minutos
            </option>

            <option value="4 horas">
                4 horas
            </option>

            <option value="Más de 4 horas">
                Más de 4 horas
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>
            Observaciones
        </label>

        <textarea rows="3" class="form-control" placeholder="Observaciones adicionales..."
            [(ngModel)]="reportService.report.observaciones" (ngModelChange)="guardarBorrador()">
        </textarea>

    </div>


    <!-- MATERIALES -->
    <div class="form-group">

        <app-materiales
            [materiales]="reportService.report.materiales"
            (materialesChange)="
                reportService.report.materiales = $event;
                guardarBorrador()
            ">
        </app-materiales>
    
    </div>


    <!-- OPERARIO -->
    <div class="form-group">

        <app-operario-list (operariosChange)="actualizarOperarios($event)">
        </app-operario-list>

    </div>


    <!-- HORA -->
    <div class="form-group">

        <label>
            Hora de entrada
        </label>

        <input type="time" class="form-control" [(ngModel)]="reportService.report.horaEntrada"
            (ngModelChange)="guardarBorrador()">

    </div>

    <!-- <div class="form-group mt-3">

        <label>
            Concepto de cobro
        </label>
    
        <input
            type="text"
            class="form-control"
            placeholder="Ingrese el concepto de cobro"
            [(ngModel)]="reportService.report.conceptoCobro"
        >
    
    </div>
    
    <div class="form-group mt-3">
    
        <label>
            Valor del cobro
        </label>
    
        <input
            type="number"
            class="form-control"
            placeholder="Ingrese el valor"
            [(ngModel)]="reportService.report.valorCobro"
        >
    
    </div> -->
    <div class="form-group mt-3">

        <app-fotos [fotos]="reportService.report.fotos" (fotosChange)="
            reportService.report.fotos = $event;
            guardarBorrador()
        ">
        </app-fotos>

    </div>

    <div class="form-group mt-4">

        <app-firma [(firma)]="reportService.report.firma" (firmaChange)="guardarBorrador()">
        </app-firma>

    </div>
    <div class="form-group mt-4">

        <button type="button" class="btn btn-primary w-100" (click)="enviarParte()">

            <i class="fa-solid fa-paper-plane"></i>

            Enviar parte

        </button>

    </div>

</div>
