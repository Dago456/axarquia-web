<div class="report-container">

    <div class="community-info">

        <h3>{{ reportService.report.nombreComunidad }}</h3>

        <p>{{ reportService.report.ubicacionComunidad }}</p>

    </div>


    <div class="form-group">

        <app-motivo-visita
            [(motivo)]="reportService.report.motivoVisita">
        </app-motivo-visita>

    </div>


    <div class="form-group">

        <label>
            Concepto del trabajo
        </label>

        <textarea
            rows="4"
            class="form-control"
            placeholder="Describa el trabajo realizado..."
            [(ngModel)]="reportService.report.conceptoTrabajo">
        </textarea>

    </div>


    <div class="form-group">

        <label>
            Observaciones
        </label>

        <textarea
            rows="3"
            class="form-control"
            placeholder="Observaciones adicionales..."
            [(ngModel)]="reportService.report.observaciones">
        </textarea>

    </div>


    <!-- MATERIALES -->
    <div class="form-group">

        <app-materiales
            [materiales]="reportService.report.materiales">
        </app-materiales>

    </div>


    <!-- OPERARIO -->
    <div class="form-group">

        <app-operario-list
            (operariosChange)="actualizarOperarios($event)">
        </app-operario-list>

    </div>


    <!-- HORA -->
    <div class="form-group">

        <label>
            Hora de entrada
        </label>

        <input
            type="time"
            class="form-control"
            [(ngModel)]="reportService.report.horaEntrada">

    </div>

    <div class="form-group mt-3">

        <label>
            Concepto de cobro
        </label>
    
        <input
            type="text"
            class="form-control"
            placeholder="Ingrese el concepto de cobro"
            [(ngModel)]="reportService.report.conceptoCobro"
        >
    
    </div>
    
    <div class="form-group mt-3">
    
        <label>
            Valor del cobro
        </label>
    
        <input
            type="number"
            class="form-control"
            placeholder="Ingrese el valor"
            [(ngModel)]="reportService.report.valorCobro"
        >
    
    </div>

</div>
