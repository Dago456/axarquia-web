<div class="materiales-container">

    <h2>Materiales</h2>

    <!-- AGREGAR MATERIAL -->
    <div class="material-input">

        <input
            type="text"
            [(ngModel)]="nuevoMaterial"
            placeholder="Ingrese un material"
            (keyup.enter)="agregarMaterial()"
        >

        <button
            type="button"
            (click)="agregarMaterial()">

            <i class="fa-solid fa-plus"></i>

            Agregar

        </button>

    </div>


    <!-- MATERIALES AGREGADOS -->
    <div
        class="items-container"
        *ngIf="materiales.length > 0">

        <div class="items-header">

            <span>
                Materiales agregados
            </span>

            <span class="contador">
                {{ materiales.length }}
            </span>

        </div>


        <!-- MATERIAL -->
        <div
            class="item-card"
            *ngFor="let material of materiales; let i = index">

            <div class="item-icon">

                <i class="fa-solid fa-box"></i>

            </div>


            <div class="item-info">

                <strong>
                    {{ material }}
                </strong>

            </div>


            <button
                type="button"
                class="btn-eliminar"
                (click)="eliminarMaterial(i)"
                title="Eliminar material">

                <i class="fa-solid fa-trash"></i>

            </button>

        </div>

    </div>

</div>
