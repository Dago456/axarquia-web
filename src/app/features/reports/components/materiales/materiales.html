<div class="materiales-container">

    <h2>Materiales</h2>

    <div style="display:flex; flex-direction:column; gap:10px; width:100%; margin-bottom:18px;">

        <input
            type="text"
            [(ngModel)]="nuevoMaterial"
            placeholder="Ingrese un material"
            (keyup.enter)="agregarMaterial()"
            style="
                width: 100%;
                height: 52px;
                padding: 0 18px;
                font-size: 16px;
                border: 1.5px solid #d9dee5;
                border-radius: 12px;
                outline: none;
                box-sizing: border-box;
                background: #fff;
                color: #26323d;
            "
        >

        <button
            type="button"
            (click)="agregarMaterial()"
            style="
                width: 100%;
                height: 52px;
                font-size: 16px;
                font-weight: 600;
                border: none;
                border-radius: 12px;
                background: #173f75;
                color: #fff;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            "
        >
            <i class="fa-solid fa-plus"></i>
            Agregar
        </button>

    </div>

    <div
        class="items-container"
        *ngIf="materiales.length > 0">

        <div class="items-header">
            <span>Materiales agregados</span>
            <span class="contador">{{ materiales.length }}</span>
        </div>

        <div
            class="item-card"
            *ngFor="let material of materiales; let i = index">

            <div class="item-icon">
                <i class="fa-solid fa-box"></i>
            </div>

            <div class="item-info">
                <strong>{{ material }}</strong>
            </div>

            <button
                type="button"
                class="btn-eliminar"
                (click)="eliminarMaterial(i)"
                title="Eliminar material">
                <i class="fa-solid fa-trash"></i>
            </button>

        </div>

    </div>

</div>
