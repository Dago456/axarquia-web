<div class="community-card mt-4" *ngFor="let community of communities" (click)="seleccionarComunidad(community)">

    <div class="title">

        {{ community.nom_comu }}

    </div>

    <div class="subtitle">

        {{ community.ubi_comu }}

    </div>

    <div class="id">

        ID {{ community.id_comunidades }}

    </div>

</div>

<div class="empty" *ngIf="communities.length == 0">

    No se encontraron comunidades

</div>
